<!DOCTYPE html>
<html lang="en" data-mode="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>owl nocturne</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg0:#07030f;--bg1:#12082a;--panel:rgba(24,12,48,.6);--edge:rgba(160,120,255,.26);--a:#9d7bff;--a2:#ff8fd8;--a3:#7ce3ff;--tx:#ece6ff;--mu:#8a7cb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-mode=day]{--bg0:#fbf6ff;--bg1:#e4d9ff;--panel:rgba(255,255,255,.65);--edge:rgba(90,60,170,.28);--a:#7a55e0;--a2:#e0559f;--a3:#2a9fd0;--tx:#2a1b4d;--mu:#6d5a9a}
html[data-mode=sunset]{--bg0:#2a0f08;--bg1:#8a3414;--panel:rgba(60,24,10,.6);--edge:rgba(255,170,100,.32);--a:#ff9a4d;--a2:#ff6b8a;--a3:#ffd27a;--tx:#fff0e0;--mu:#e0a77f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto 1fr auto;height:100%;overflow:hidden;color:var(--tx);font-family:'JetBrains Mono',ui-monospace,monospace;background:radial-gradient(ellipse 90% 60% at 50% 15%,color-mix(in srgb,var(--a) 22%,transparent),transparent 60%),linear-gradient(180deg,var(--bg0),var(--bg1) 60%,var(--bg0));transition:background 1.5s}
canvas#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 16vw rgba(0,0,0,.35)}
header,footer,main,.icons{position:relative;z-index:3;transition:opacity .8s}
header{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.1rem;font-size:.75rem;color:var(--mu)}
.pill{display:inline-flex;gap:.5rem;align-items:center;padding:.3rem .7rem;border:1px solid var(--edge);border-radius:99px;background:var(--panel);backdrop-filter:blur(8px)}
.pill i{width:.5rem;height:.5rem;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);animation:bl 1.6s infinite}
.pill.on i{background:#4be08a;box-shadow:0 0 8px #4be08a;animation:none}
@keyframes bl{50%{opacity:.25}}
.icons{position:absolute;left:.7rem;top:3.6rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.ic{width:4.2rem;background:none;border:0;color:var(--tx);font:inherit;font-size:.62rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.4rem .2rem;border-radius:12px;cursor:pointer}
.ic:hover{background:var(--panel)}.ic b{font-size:1.5rem;font-weight:400}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 1rem;min-height:0}
.orbwrap{position:relative;width:min(58vw,290px);aspect-ratio:1;display:grid;place-items:center;transition:transform .8s}
.ring{position:absolute;border-radius:50%;border:1px solid var(--edge);inset:calc(var(--i)*9%);animation:sp calc(30s + var(--i)*14s) linear infinite alternate}
@keyframes sp{to{transform:rotate(360deg)}}
.core{width:38%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--a3),var(--a) 50%,transparent);box-shadow:0 0 calc(50px + var(--amp,0)*90px) calc(6px + var(--amp,0)*16px) color-mix(in srgb,var(--a) 50%,transparent);animation:br 5s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.1)}}
#owl{position:absolute;top:-2.3rem;left:50%;width:3.6rem;transform:translateX(-50%);cursor:pointer;z-index:5;filter:drop-shadow(0 0 10px var(--a));animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px) rotate(-2deg)}}
#owl.gold{filter:drop-shadow(0 0 16px #ffd76b)}
#bub{position:absolute;top:-5.4rem;left:50%;transform:translateX(-50%);max-width:14rem;padding:.4rem .7rem;font-size:.68rem;background:var(--panel);border:1px solid var(--edge);border-radius:10px;backdrop-filter:blur(8px);opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
#bub.show{opacity:1}
h1{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(2.2rem,9vw,3.4rem);letter-spacing:.14em;margin:1rem 0 .1rem;background:linear-gradient(90deg,var(--a),var(--a2) 60%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
#timer{font-size:1.2rem;letter-spacing:.12em;color:var(--a);margin-bottom:.6rem;font-variant-numeric:tabular-nums}
#msg{max-width:26rem;color:var(--mu);font-size:.82rem;padding:.5rem .9rem;border:1px dashed var(--edge);border-radius:10px;outline:0}
#msg::before{content:"» ";color:var(--a)}#msg:focus{color:var(--tx)}
#worlds{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin-top:1.2rem}
.wc{padding:.45rem .8rem;border:1px solid var(--edge);background:var(--panel);backdrop-filter:blur(8px);border-radius:12px;text-align:left}
.wc small{display:block;font-size:.6rem;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
footer{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;background:var(--panel);backdrop-filter:blur(18px);border-top:1px solid var(--edge)}
#tasks{flex:1;display:flex;gap:.4rem;overflow-x:auto}
button.b{font:inherit;font-size:.72rem;color:var(--tx);background:var(--panel);border:1px solid var(--edge);padding:.45rem .75rem;border-radius:10px;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--a)}
.win{position:fixed;width:min(92vw,380px);max-height:72dvh;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--edge);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);z-index:10;overflow:hidden}
.wh{display:flex;justify-content:space-between;align-items:center;padding:.6rem .8rem;border-bottom:1px solid var(--edge);font-size:.78rem;cursor:grab;touch-action:none;user-select:none}
.wb{padding:.9rem;overflow:auto;font-size:.76rem;display:flex;flex-direction:column;gap:.55rem}
.wb label{display:flex;justify-content:space-between;align-items:center;gap:.6rem;color:var(--mu)}
.wb h4{margin:.6rem 0 0;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--a)}
input,select,textarea{font:inherit;font-size:.74rem;color:var(--tx);background:rgba(127,100,200,.12);border:1px solid var(--edge);border-radius:8px;padding:.4rem .5rem;max-width:62%}
textarea{width:100%;max-width:100%;min-height:10rem;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--edge);padding:.25rem 0}
#toast{position:fixed;left:50%;bottom:4.5rem;transform:translateX(-50%);padding:.5rem .9rem;background:var(--panel);border:1px solid var(--a);border-radius:10px;font-size:.72rem;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none;backdrop-filter:blur(10px)}
#toast.show{opacity:1}
body.idle header,body.idle footer,body.idle .icons,body.idle #worlds,body.idle #hint{opacity:0;pointer-events:none}body.idle #msg{pointer-events:none}
body.idle .orbwrap{transform:scale(1.3)}body.idle{cursor:none}
body.witch{animation:wf 6s ease-in-out infinite}
@keyframes wf{50%{filter:hue-rotate(-24deg) brightness(.9)}}
input[type=range]{padding:0;accent-color:var(--a)}
.icons{bottom:4.2rem;flex-wrap:wrap;align-content:flex-start}
body.glitch{animation:gl .12s steps(2) infinite}@keyframes gl{20%{transform:translate(-2px,1px)}60%{transform:translate(2px,-1px)}}
body.glitch .core,body.glitch h1{animation:hs 1.4s linear infinite}@keyframes hs{to{filter:hue-rotate(360deg)}}
#wins{display:contents}
.icons{position:fixed;inset:0;display:block;pointer-events:none}
.ic{position:absolute;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
#boot{position:fixed;inset:0;z-index:9999;background:var(--bg0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;transition:opacity .9s}
#boot.out{opacity:0;pointer-events:none}
#bt{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(1.6rem,7vw,3rem);letter-spacing:.14em;text-shadow:0 0 18px var(--a),0 0 44px color-mix(in srgb,var(--a) 50%,transparent)}
.cur{display:inline-block;width:.5ch;background:var(--a3);animation:bl 1s steps(1) infinite;margin-left:3px}
#bs{font-size:.75rem;color:var(--mu);letter-spacing:.1em;min-height:1em}
#bb{width:min(60vw,300px);height:3px;background:var(--edge);border-radius:2px;overflow:hidden}
#bb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a3),var(--a2));box-shadow:0 0 12px var(--a2);transition:width 2s cubic-bezier(.2,.8,.2,1)}
.sn{position:absolute;width:170px;min-height:140px;border-radius:8px;border:1px solid var(--edge);box-shadow:0 10px 26px rgba(0,0,0,.35);z-index:6;display:flex;flex-direction:column}
.sh{display:flex;justify-content:space-between;padding:.25rem .4rem;cursor:grab;touch-action:none}
.sh button{background:none;border:0;color:#b9a9e8;cursor:pointer;font-size:.8rem}
.sn textarea{flex:1;min-height:110px;width:100%;max-width:100%;background:none;border:0;outline:0;resize:none;color:#eee9fb;border-radius:0}
body.idle .sn{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){.ring,.core,#owl,body.witch,body.glitch,body.glitch .core,body.glitch h1{animation:none}}

/* owl moods */
#owl *{transform-box:fill-box;transform-origin:center}
#owl .ec,#owl .hy,#owl .hr,#owl .dz,#owl .br,#owl .ch,#owl .sh,#owl .zz,#owl .sw,#owl .hp{opacity:0;transition:opacity .25s,transform .25s}
#owl .eo,#owl .all,#owl .iris,#owl .bk,#owl .b1,#owl .b2{transition:opacity .25s,transform .25s,fill .25s}
#owl .pl{transform:translate(var(--px,0px),var(--py,0px));transition:transform .12s}
#owl[data-m=happy] .eo,#owl[data-m=sleepy] .eo,#owl[data-m=love] .eo,#owl[data-m=dizzy] .eo,#owl[data-m=vibing] .eo,#owl[data-m=cool] .eo{opacity:0}
#owl[data-m=happy] .hy,#owl[data-m=vibing] .hy{opacity:1}
#owl[data-m=happy] .ch,#owl[data-m=love] .ch{opacity:1}
#owl[data-m=sleepy] .ec{opacity:1}
#owl[data-m=sleepy] .zz{opacity:1;animation:zf 2.4s ease-in-out infinite}
#owl[data-m=love] .hr{opacity:1;animation:hb 1s ease-in-out infinite}
#owl[data-m=dizzy] .dz,#owl[data-m=dizzy] .sw{opacity:1}
#owl[data-m=dizzy] .dz circle{animation:sp .6s linear infinite}
#owl[data-m=vibing] .hp{opacity:1}
#owl[data-m=cool] .sh{opacity:1}
#owl[data-m=surprised] .iris{transform:scale(1.28)}
#owl[data-m=surprised] .bk{transform:scale(1.3)}
#owl[data-m=surprised] .br,#owl[data-m=curious] .br,#owl[data-m=grumpy] .br,#owl[data-m=spooky] .br{opacity:1}
#owl[data-m=surprised] .b1,#owl[data-m=surprised] .b2{transform:translateY(-3px)}
#owl[data-m=curious] .b2{transform:translateY(-3px) rotate(-8deg)}
#owl[data-m=curious] .all{transform:rotate(-7deg)}
#owl[data-m=grumpy] .b1,#owl[data-m=spooky] .b1{transform:rotate(22deg)}
#owl[data-m=grumpy] .b2,#owl[data-m=spooky] .b2{transform:rotate(-22deg)}
#owl[data-m=grumpy] .iris{fill:#ff8fd8}
#owl[data-m=spooky] .iris{fill:#ff5a3c}
#owl[data-m=spooky] .pp{transform:scaleX(.45)}
#owl[data-m=spooky]{filter:drop-shadow(0 0 12px #ff5a3c)}
#owl[data-m=sleepy]{animation-duration:8s}#owl[data-m=vibing]{animation-duration:1.2s}
@keyframes zf{50%{transform:translateY(-3px)}}@keyframes hb{50%{transform:scale(1.15)}}
.core{cursor:pointer}.core.unstable{animation:ov .16s linear infinite}
@keyframes ov{0%{transform:scale(1)}25%{transform:scale(1.12) translate(-3px,2px);filter:hue-rotate(120deg)}50%{transform:scale(.9) translate(3px,-2px);filter:hue-rotate(240deg)}75%{transform:scale(1.07) translate(-2px,-3px);filter:hue-rotate(320deg)}}
.orbwrap{touch-action:none}
/* status message */
#msg{cursor:text;transition:border-color .2s}#msg:hover{border-color:var(--a)}#msg:focus{border-style:solid;border-color:var(--a)}
#msg::after{content:" ✎";color:var(--mu);opacity:.55;font-size:.7rem}#msg:focus::after{content:""}
#hint{margin-top:.5rem;font-size:.6rem;color:var(--mu);opacity:.6;transition:opacity .8s}
/* minimise */
.wbtns{display:flex;gap:.3rem}.b.min{opacity:.55;font-style:italic}
@media(prefers-reduced-motion:reduce){#owl .dz circle,#owl .zz,#owl .hr,.core.unstable{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="vig"></div>
<div id="boot"><div id="bt">OWL NOCTURNE<span class="cur">&nbsp;</span></div><div id="bs">booting dreamstate…</div><div id="bb"><i></i></div></div>
<header>
  <div class="pill" id="pill"><i></i><span id="st">AFK</span></div>
  <div><span id="wxh" style="cursor:pointer;margin-right:.6rem"></span><span id="modeLbl"></span> · <span id="clk">--:--</span></div>
</header>
<nav class="icons" id="icons"></nav>
<main>
  <div class="orbwrap">
    <svg id="owl" viewBox="0 0 64 64"><defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a6ff"/><stop offset="1" stop-color="#6a3fd6"/></linearGradient></defs>
      <g class="all">
      <path d="M17 13L24 27 12 24Z" fill="url(#og)"/><path d="M47 13L40 27 52 24Z" fill="url(#og)"/>
      <ellipse cx="32" cy="37" rx="21" ry="19" fill="url(#og)"/><circle cx="32" cy="35" r="15.5" fill="#150a28" opacity=".6"/>
      <g class="hp"><path d="M12 33Q12 10 32 10Q52 10 52 33" stroke="#ff8fd8" stroke-width="3" fill="none"/><rect x="8" y="30" width="7" height="11" rx="3" fill="#ff8fd8"/><rect x="49" y="30" width="7" height="11" rx="3" fill="#ff8fd8"/></g>
      <g class="eo"><circle class="iris" cx="24" cy="35" r="5.2" fill="#c3a6ff"/><circle class="iris" cx="40" cy="35" r="5.2" fill="#c3a6ff"/><g class="pl"><circle class="pp" cx="24" cy="35" r="2.1" fill="#07030f"/><circle class="pp" cx="40" cy="35" r="2.1" fill="#07030f"/></g></g>
      <g class="ec"><path d="M19 35Q24 39 29 35M35 35Q40 39 45 35" stroke="#c3a6ff" stroke-width="2" fill="none" stroke-linecap="round"/></g>
      <g class="hy"><path d="M19 37Q24 30 29 37M35 37Q40 30 45 37" stroke="#c3a6ff" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>
      <g class="hr"><path d="M24 40C17 35 18 29 22 29C23.5 29 24 30.5 24 31C24 30.5 24.5 29 26 29C30 29 31 35 24 40Z" fill="#ff8fd8"/><path transform="translate(16 0)" d="M24 40C17 35 18 29 22 29C23.5 29 24 30.5 24 31C24 30.5 24.5 29 26 29C30 29 31 35 24 40Z" fill="#ff8fd8"/></g>
      <g class="dz"><circle cx="24" cy="35" r="4.5" stroke="#c3a6ff" stroke-width="1.5" fill="none" stroke-dasharray="14 6"/><circle cx="40" cy="35" r="4.5" stroke="#c3a6ff" stroke-width="1.5" fill="none" stroke-dasharray="14 6"/></g>
      <g class="br"><path class="b1" d="M18 27.5H30" stroke="#ece6ff" stroke-width="2" stroke-linecap="round"/><path class="b2" d="M34 27.5H46" stroke="#ece6ff" stroke-width="2" stroke-linecap="round"/></g>
      <g class="ch"><ellipse cx="16.5" cy="42" rx="3.4" ry="2" fill="#ff8fd8" opacity=".55"/><ellipse cx="47.5" cy="42" rx="3.4" ry="2" fill="#ff8fd8" opacity=".55"/></g>
      <g class="sh"><rect x="16.5" y="31" width="14" height="8" rx="2" fill="#0a0414"/><rect x="33.5" y="31" width="14" height="8" rx="2" fill="#0a0414"/><rect x="30.5" y="33" width="3" height="2" fill="#0a0414"/></g>
      <path class="bk" d="M32 41L27.5 47.5H36.5Z" fill="#ff8fd8"/>
      <path class="sw" d="M50 22Q53.5 27 50 30Q46.5 27 50 22Z" fill="#7ce3ff"/>
      </g>
      <g class="zz"><text x="47" y="16" font-size="9" fill="#c3a6ff" font-family="Orbitron,sans-serif">z</text><text x="53" y="9" font-size="6" fill="#c3a6ff" font-family="Orbitron,sans-serif">z</text></g></svg>
    <div id="bub"></div>
    <div class="ring" style="--i:0"></div><div class="ring" style="--i:1"></div><div class="ring" style="--i:2"></div><div class="core"></div>
  </div>
  <h1>AFK</h1><div id="timer">00:00:00</div>
  <div id="msg" contenteditable="true" spellcheck="false" role="textbox" aria-label="status message" title="click to edit your status">roosting for a bit — hoot if urgent</div>
  <div id="worlds"></div><div id="hint">click the message to edit it · click the orb for a new chord · drag the orb around</div>
</main>
<div id="wins"></div><div id="toast"></div>
<footer><button class="b" id="start">🦉 OWL</button><div id="tasks"></div><button class="b" id="gear" title="settings">⚙</button><button class="b" id="play">▶ haze</button><span id="wk" style="font-size:.65rem;color:var(--mu)"></span></footer>

<script>
const $=s=>document.querySelector(s);
const ST={get(k,d){try{const v=localStorage.getItem('on:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('on:'+k,JSON.stringify(v))}catch(e){}}};
const K=['mail','mode','sr','ss','acc','witch','wh','saver','links','hoots','msg','hid','pos','stk','wxp','unit','aw','twi'];
const D={mail:'',mode:'auto',sr:'06:30',ss:'18:30',acc:'',witch:true,wh:-1,saver:true,links:[],hoots:0,msg:null,hid:[],pos:{},stk:[],wxp:null,unit:'C',aw:false,twi:60};
const S={};K.forEach(k=>S[k]=ST.get(k,D[k]));
const save=()=>K.forEach(k=>ST.set(k,S[k]));
S.links.forEach(l=>{l.id=l.id||'l'+Math.random().toString(36).slice(2,8)});
const hm=t=>{const[a,b]=t.split(':');return +a+ +b/60};
const wHour=()=>{if(+S.wh>=0)return +S.wh;const r=hm(S.sr),q=hm(S.ss);return Math.floor((q+((r+24-q)%24)/2)%24)};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}

/* ---- dynamic theme: day / sunset-sunrise / night ---- */
let pc='#9d7bff';
function phase(){if(S.mode!=='auto')return S.mode;const n=new Date(),h=n.getHours()+n.getMinutes()/60,r=hm(S.sr),s=hm(S.ss);const tw=(+S.twi||60)/120;if(Math.abs(h-r)<tw||Math.abs(h-s)<tw)return'sunset';return h>r&&h<s?'day':'night'}
function theme(){const m=phase(),r=document.documentElement;r.dataset.mode=m;S.acc?r.style.setProperty('--a',S.acc):r.style.removeProperty('--a');$('#modeLbl').textContent=m;
 pc=getComputedStyle(r).getPropertyValue('--a').trim()||pc;
 document.body.classList.toggle('witch',!!S.witch&&new Date().getHours()==wHour())}

/* ---- keep awake ---- */
let wl=null;
async function awake(on,q){try{try{await wl?.release()}catch(e){}wl=null;if(on){wl=await navigator.wakeLock.request('screen');$('#wk').textContent='☀ awake'}else $('#wk').textContent='';S.aw=!!on;save();return true}catch(e){q||toast('keep-awake not available here');$('#wk').textContent='';return false}}
document.addEventListener('visibilitychange',()=>{if(S.aw&&document.visibilityState==='visible')awake(true,1)});

/* ---- owl ---- */
const OL=["who's AFK now 🦉","hoot if you need me","still here. always here.","orb's warm, seat's warmer","nocturnal by design","*ruffles feathers*"];
const WL=["the veil is thin tonight 🕯️","witching hour. don't look behind you","*hoots ominously*"];
const witching=()=>S.witch&&new Date().getHours()==wHour();
const owl=$('#owl'),bub=$('#bub');
function say(t){bub.textContent=t;bub.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>bub.classList.remove('show'),3200)}
let ac;function hoot(){try{ac=ac||new AudioContext();ac.resume();[[560,0],[430,.16]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+d;o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(.13,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+.32);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+.35)})}catch(e){}}
if(S.hoots>=7)owl.classList.add('gold');
const MOODS=['neutral','happy','sleepy','surprised','love','grumpy','spooky','dizzy','vibing','curious','cool'];
let mOv=null,mT,idleNow=false,taps=[];
const baseMood=()=>idleNow?'sleepy':witching()?'spooky':(A.on?'vibing':'neutral');
function paintMood(){const m=mOv||baseMood();if(owl.dataset.m!==m)owl.dataset.m=m}
function mood(m,ms){if(ms){mOv=m;clearTimeout(mT);mT=setTimeout(()=>{mOv=null;paintMood()},ms)}paintMood()}
function owlTap(){
 hoot();S.hoots++;save();const n=Date.now();taps=taps.filter(t=>n-t<2500);taps.push(n);

/* ====================== EASTER EGG: PHOTON CATCH ====================== */
let photonCatchOpen = false;
function openPhotonCatch(){
  if (photonCatchOpen) return;
  photonCatchOpen = true;
  say('found something hidden 👀');
  

  const totalCaught = ST.get('photonTotal',0);
  const best = ST.get('photonBest',0);

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; z-index:9000; display:flex; align-items:center; justify-content:center; background:rgba(5,2,12,.55); backdrop-filter:blur(4px); opacity:0; transition:opacity .3s;';
  overlay.innerHTML = `
    <div style="background:rgba(20,10,40,.92); border:1px solid rgba(160,120,255,.3); border-radius:16px; padding:1rem 1.2rem 1.3rem; width:min(90vw,320px); text-align:center; box-shadow:0 0 40px rgba(157,123,255,.25);">
      <div style="font-family:'Orbitron',sans-serif; font-size:.78rem; letter-spacing:.12em; color:#c3a6ff; margin-bottom:.2rem;">🌌 PHOTON CATCH</div>
      <div style="font-size:.65rem; color:#8a7cb0; margin-bottom:.6rem;">stray photons drift by — move your mouse to help, or just watch</div>
      <canvas id="photonCanvas" width="280" height="200" style="width:100%; border-radius:10px; background:radial-gradient(ellipse at 50% 0%, #150a28, #07030f); cursor:none; touch-action:none;"></canvas>
      <div style="display:flex; justify-content:space-between; font-size:.68rem; color:#8a7cb0; margin-top:.5rem;">
        <span>caught: <b id="photonScore" style="color:#c3a6ff;">0</b></span>
        <span>best run: <b id="photonBest" style="color:#ff8fd8;">${best}</b></span>
        <span>lifetime: <b id="photonLifetime" style="color:#ece6ff;">${totalCaught}</b></span>
      </div>
      <button id="photonCloseBtn" style="margin-top:.7rem; font-family:inherit; font-size:.72rem; color:#ece6ff; background:rgba(157,123,255,.12); border:1px solid rgba(160,120,255,.3); padding:.4rem .9rem; border-radius:8px; cursor:pointer;">close</button>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.style.opacity = '1');

  const canvas = overlay.querySelector('#photonCanvas');
  const pctx = canvas.getContext('2d');
  const scoreEl = overlay.querySelector('#photonScore');
  const lifetimeEl = overlay.querySelector('#photonLifetime');
  const bestEl = overlay.querySelector('#photonBest');

  let score = 0;
  let lifetime = totalCaught;
  let bestRun = best;
  const netY = 186;
  const netW = 44;
  let net = { x: 140, targetX: 140 };
  let manualUntil = 0;
  let photons = [];
  let spawnTimer = 0;
  let rafId = null;

  function spawnPhoton(){
    const gold = Math.random() < 0.12;
    photons.push({ x: 12 + Math.random() * 256, y: -8, vy: 0.55 + Math.random() * 0.5, size: gold ? 5 : 3.4, gold });
  }

  function pointerX(clientX){
    const rect = canvas.getBoundingClientRect();
    return ((clientX - rect.left) / rect.width) * 280;
  }
  function onPointerMove(e){
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    net.targetX = Math.max(netW/2, Math.min(280 - netW/2, pointerX(clientX)));
    manualUntil = Date.now() + 1400;
  }
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('touchmove', onPointerMove, { passive:true });

  function catchBlip(gold){
    try {
      sfxCtx = sfxCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (sfxCtx.state === 'suspended') sfxCtx.resume();
      const now = sfxCtx.currentTime;
      const o = sfxCtx.createOscillator();
      const g = sfxCtx.createGain();
      o.type = 'sine';
      o.frequency.value = gold ? 920 : 700;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.09, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      o.connect(g).connect(sfxCtx.destination);
      o.start(now); o.stop(now + 0.25);
    } catch(e) {}
  }

  function tick(){
    pctx.clearRect(0, 0, 280, 200);

    spawnTimer++;
    if (spawnTimer > 42){ spawnTimer = 0; spawnPhoton(); }

    // passive autopilot: drift toward the lowest photon unless the mouse recently took over
    if (Date.now() > manualUntil){
      const lowest = photons.reduce((a,b) => (!a || b.y > a.y) ? b : a, null);
      if (lowest) net.targetX = lowest.x;
    }
    net.x += (net.targetX - net.x) * 0.12;

    photons = photons.filter(p => {
      p.y += p.vy;
      const caught = p.y >= netY - 6 && p.y <= netY + 10 && Math.abs(p.x - net.x) < netW/2 + p.size;
      if (caught){
        score += p.gold ? 5 : 1;
        lifetime += p.gold ? 5 : 1;
        scoreEl.textContent = score;
        lifetimeEl.textContent = lifetime;
        catchBlip(p.gold);
        ST.set('photonTotal', lifetime);
        return false;
      }
      return p.y < 210;
    });

    // draw photons
    photons.forEach(p => {
      pctx.beginPath();
      pctx.fillStyle = p.gold ? '#ffd76b' : '#c3a6ff';
      pctx.shadowColor = p.gold ? '#ffd76b' : '#9d7bff';
      pctx.shadowBlur = 8;
      pctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      pctx.fill();
    });
    pctx.shadowBlur = 0;

    // draw net
    pctx.fillStyle = 'rgba(157,123,255,.85)';
    pctx.fillRect(net.x - netW/2, netY, netW, 5);
    pctx.beginPath();
    pctx.fillStyle = 'rgba(255,143,216,.9)';
    pctx.arc(net.x, netY + 2, 3, 0, Math.PI*2);
    pctx.fill();

    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);

  function closePhotonCatch(){
    photonCatchOpen = false;
    cancelAnimationFrame(rafId);
    if (score > bestRun){
      bestRun = score;
      ST.set('photonBest', bestRun);
    }
    overlay.style.opacity = '0';
    setTimeout(() => overlay.remove(), 300);
    document.removeEventListener('keydown', escHandler);
  }
  function escHandler(e){ if (e.key === 'Escape') closePhotonCatch(); }
  document.addEventListener('keydown', escHandler);
  overlay.querySelector('#photonCloseBtn').addEventListener('click', closePhotonCatch);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closePhotonCatch(); });
}
